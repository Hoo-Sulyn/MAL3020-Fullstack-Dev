services:
  mongo:
    image: mongo:7
    container_name: hotel-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: hotel-backend
    env_file: ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/hotel
    ports:
      - "3000:3000"
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: hotel-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mongo-data: