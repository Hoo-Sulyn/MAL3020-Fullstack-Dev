services:
  mongo:
    image: mongo:7
    container_name: hotel-mongo
    ports:
      - "127.0.0.1:27017:27017"  # tests on this computer only; never expose the database to the network
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    container_name: hotel-backend
    env_file: ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/hotel
    ports:
      - "3000:3000"
    # Longer than the backend's drain delay (1 s) plus its request time limit (10 s),
    # so Docker waits for a graceful shutdown instead of force-killing the container.
    stop_grace_period: 15s
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: hotel-frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data: