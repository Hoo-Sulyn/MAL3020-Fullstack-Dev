<header>
        <img style="width:90px; padding: 10px 0;" src="haven-full-logo.png" alt="Logo">
        
        <div class="nav">
            <a
                id="rooms"
                routerLink="/hotelBooking"
                [class.active]="roomsSectionActive">
                Rooms
            </a>
            <a id="history" routerLink="/history" routerLinkActive="active">History</a>
            <a id="profile" routerLink="/profile" routerLinkActive="active">Profile</a>
        </div>

        <div class="currency-user">
            <p id="currency" title="Ringgit Malaysia (RM)">MYR</p>

            <a *ngIf="!guestUser" id="user-profile" routerLink="/" aria-label="Sign in">
                <img src="user-icon.png" alt="User icon">
                <p id="user-name">Sign in</p>
            </a>

            <div *ngIf="guestUser as user" id="user-sign-out">
                <p id="guest-name">{{ user.firstName }} {{ user.lastName }}</p>
                <button type="button" id="sign-out-btn" (click)="signOut()">Sign out</button>
            </div>
        </div>
  </header>
